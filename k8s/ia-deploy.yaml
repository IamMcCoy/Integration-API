---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-api
  namespace: integration-api
  labels:
    app: integration-api
spec:
  # ADR-0002: upload_staging_dir 은 POST 를 받은 파드와 워커 파드가 공유해야 한다.
  # 지금은 hostPath 라 노드 로컬이다. 레플리카를 늘리려면 먼저 ReadWriteMany 볼륨
  # (NFS/CephFS 등)으로 바꿔야 한다. 그전에 늘리면 워커가 파일을 못 찾는다.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: integration-api
  template:
    metadata:
      labels:
        app: integration-api
    spec:
      # staging 은 hostPath 라 노드에서 root 소유로 생긴다. 앱은 non-root(uid 1000)로
      # 돌므로 그대로면 업로드 착지가 Permission denied 로 죽는다. hostPath 에는
      # fsGroup 이 적용되지 않아 initContainer 로 소유자를 맞춘다.
      initContainers:
        - name: fix-staging-perms
          image: busybox:1.36
          command: ['chown', '1000:1000', '/staging']
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: staging
              mountPath: /staging
      containers:
        - name: integration-api
          image: registry.seculayer.com:31500/integration-api:0.1.0
          # 아직 레지스트리에 푸시하지 않는다 — 로컬 빌드 이미지를 `make k3d-load` 로
          # 클러스터에 넣어 쓴다. Always 면 pull 을 시도하다 실패하므로 IfNotPresent.
          # 레지스트리 푸시로 전환하면 Always 로 되돌린다.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8880
          env:
            - name: TZ
              value: Asia/Seoul
            # OpenAI SDK 가 직접 읽는 이름이라 접두사가 없다.
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: integration-api-secret
                  key: openai-api-key
            # IA_ 접두사 환경변수는 ConfigMap 의 같은 이름 설정을 덮어쓴다.
            # ConfigMap 을 갈아끼우지 않고 값 하나만 바꿀 때 여기에 추가한다.
            #   - name: IA_OPENAI_MAX_CONCURRENCY
            #     value: "4"
            #
            # 큐(BRPOP)는 같은 Redis DB 를 보는 모든 인스턴스가 나눠 먹는다.
            # 다른 호스트의 개발 인스턴스가 이 Redis 를 같이 쓰면 업로드 파일이 없는
            # 쪽이 태스크를 가로채 즉사한다 — 파드는 DB 1 로 격리한다.
            - name: IA_REDIS_DB
              value: "1"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              memory: 4Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8880
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: timezone-config
              mountPath: /etc/localtime
            # ia-conf.xml(ConfigMap) 과 db.properties(Secret) 가 같은 디렉토리에
            # 있어야 한다. ConfigManager 는 cwd 기준으로, DBPool 은 소스 경로 기준으로
            # 각각 conf/ 를 찾는데 둘 다 /opt/app/conf 로 떨어진다.
            - name: conf
              mountPath: /opt/app/conf
              readOnly: true
            - name: staging
              mountPath: /opt/app/staging

      volumes:
        - name: timezone-config
          hostPath:
            path: /usr/share/zoneinfo/Asia/Seoul
        # ConfigMap 과 Secret 을 한 디렉토리로 합친다.
        - name: conf
          projected:
            sources:
              - configMap:
                  name: integration-api-conf
              - secret:
                  name: integration-api-secret
                  items:
                    - key: db.properties
                      path: db.properties
        - name: staging
          hostPath:
            path: /raid/integration-api/data/staging
            type: DirectoryOrCreate
      nodeSelector:
        app: "true"
        master: "true"
      restartPolicy: Always
---
kind: Service
apiVersion: v1
metadata:
  name: integration-api-svc
  namespace: integration-api
spec:
  type: NodePort
  ports:
    - name: http
      port: 8880
      targetPort: 8880
      nodePort: 30880
  selector:
    app: integration-api
