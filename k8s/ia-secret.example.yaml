---
# 실제 값을 채운 뒤 k8s/ia-secret.yaml 로 복사해서 적용한다.
# ia-secret.yaml 은 gitignore 되어 있다. 이 예시 파일만 커밋한다.
#
#   cp k8s/ia-secret.example.yaml k8s/ia-secret.yaml
#   # 값 채우기
#   kubectl apply -f k8s/ia-secret.yaml
#
# stringData 는 kubectl 이 알아서 base64 로 인코딩한다. 직접 인코딩하지 않는다.
#
# ---------------------------------------------------------------------------
# DB 계정은 같은 값을 두 곳에 다른 형태로 넣어야 한다. 하나만 바꾸면 접속이 안 된다.
#
#   평문                                AES256 암호문
#   integration-api-mariadb-secret  →   integration-api-secret 의 db.properties
#   (MariaDB 가 계정을 만들 때 씀)       (DBPool 이 복호화해서 접속할 때 씀)
#
# 암호문 만들기 — 출력 두 줄이 순서대로 username / password 다:
#
#   PYTHONPATH=. python -m src.utils.AES256 integration change-me
#
# 아래 예시는 그 명령으로 실제로 만든 값이다. 비밀번호를 바꾸면 둘 다 다시 만든다.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: integration-api-secret
  namespace: integration-api
type: Opaque
stringData:
  # OpenAI SDK 가 직접 읽는 이름이라 IA_ 접두사가 없다.
  openai-api-key: sk-proj-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx

  # DBPool 이 /opt/app/conf/db.properties 로 읽는 파일 전체다.
  # 평문을 넣으면 복호화 단계에서 죽는다.
  db.properties: |
    [database]
    url=integration-api-mariadb-svc:3306/integration_api
    username=9eWPrMjM8xZlZfDz9pjnlmHNEjNAzlhgjFHn7gn4vfs=
    password=zJjIWdMyV9WK4lxV/VHOX2qbJdDOhVCZCHd+DSQXt6Y=
    pool_size=5
    pool_recycle=500
---
# MariaDB 컨테이너가 첫 기동 때 계정을 만들 때 쓰는 값이다.
#
# 주의: 데이터 디렉토리(/raid/integration-api/data/mariadb)가 비어 있을 때만 적용된다.
# 이미 데이터가 있으면 여기를 바꿔도 계정은 그대로다 — 디렉토리를 지우거나
# ALTER USER 를 직접 쳐야 한다.
apiVersion: v1
kind: Secret
metadata:
  name: integration-api-mariadb-secret
  namespace: integration-api
type: Opaque
stringData:
  root-password: change-me-root
  username: integration
  password: change-me
